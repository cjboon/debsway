# Runs shellcheck on every push and pull request.
name: shellcheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a tag can be moved to different code
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck $(git ls-files '*.sh' 'bin/*')
      - run: bash test.sh --offline
