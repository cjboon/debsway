# Runs shellcheck on every push and pull request.
name: shellcheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck $(git ls-files '*.sh' 'bin/*')
      - run: bash test.sh --offline
