# debsway's answers for the Debian installer (prep/make-install-iso.sh fills in
# the @...@ values when it builds the ISO). It answers everything but three
# questions, which stay yours on purpose:
#   - the disk encryption passphrase (asked twice; you type it at every boot)
#   - your user's password (asked twice; it is also your sudo password)
#   - the final "write the changes to disks?", which names the disk it erases
# Nothing secret is in this file or on the ISO.

# Language, keyboard, clock
d-i debian-installer/locale string @LOCALE@
d-i keyboard-configuration/xkb-keymap select @KEYMAP@
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network: a plain host name (it isn't sent to networks once debsway's
# random-mac part is in), and the mirror over https
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/hostname string debian
d-i netcfg/get_domain string
d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true

# No root password: root is locked and your user gets sudo (see README.md)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string @USERNAME@
d-i passwd/username string @USERNAME@

# The whole disk, encrypted LVM. partman/early_command (disk.sh) picks the
# disk when there is exactly one besides the installer's own stick; with more
# the installer asks which. The disk is filled with random data first unless
# the ISO was built with --no-erase (old, unencrypted data would otherwise stay
# readable in the unused space).
d-i partman/early_command string sh /cdrom/debsway-install/disk.sh
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-crypto/erase_disks boolean @ERASE@
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
# partman/confirm and partman-crypto/confirm are left out: the installer asks

# Only "standard system utilities": no desktop (debsway sets up sway)
tasksel tasksel/first multiselect standard
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/include string
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
# (disk.sh puts the boot loader on the chosen disk; otherwise the installer asks)

# debsway into ~/debsway, owned by your user
d-i preseed/late_command string sh /cdrom/debsway-install/late.sh @USERNAME@

d-i finish-install/reboot_in_progress note
