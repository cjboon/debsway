# Written by debsway extras/lid-awake.sh: closing the lid doesn't suspend the
# laptop, so the network and alarms keep going. sway locks the screen and turns
# the laptop's own panel off instead (bin/lid). Plugged in or docked too.
# Remove with: bash extras/lid-awake.sh --remove
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
