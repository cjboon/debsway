# Kernel modules nobody on a laptop needs and that have a history of
# security bugs (debsway parts/module-blacklist.sh). "install X /bin/false"
# makes loading them fail even when something asks for them by name.
# Delete a line (and run: sudo update-initramfs -u) to get one back.

# Network protocols almost nothing uses
dccp
sctp
rds
tipc
ax25
netrom
rose
# Old and rare filesystems: a stick with one of these is the way in
cramfs
freevxfs
jffs2
hfs
affs
bfs
befs
efs
qnx4
qnx6
sysv
minix
omfs
hpfs
ufs
# FireWire: it can read the computer's memory directly (DMA)
firewire-core
firewire-ohci
firewire-sbp2
