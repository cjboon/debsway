# Written by debsway (data/autologin-getty.conf; extras/autologin.sh or the
# install stick's --autologin): tty1 logs @USER@ in without asking for the
# password, and ~/.profile then starts sway. The disk passphrase (if the disk
# is encrypted), the screen lock and sudo still ask.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noreset --noclear --autologin @USER@ - ${TERM}
