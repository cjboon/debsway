# Written by debsway parts/console-tmux.sh
# tmux inside sway (a terminal window) is plain tmux with these few settings; on a text
# console, with no sway, it is dressed like the sway desktop (console.conf, same folder).

set -g mouse on
set -g base-index 1
set -g escape-time 10
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# On a text console (no sway session) the sway-like bar and Alt keys. In a terminal
# window under sway they would only repeat the real bar and fight sway's Alt keys.
if-shell '[ -z "$WAYLAND_DISPLAY" ]' 'source-file ~/.config/tmux/console.conf'
